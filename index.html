<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Sport Tracker</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="app">
        <header>
            <h1>Sport Tracker</h1>
            <nav>
                <button class="nav-btn active" data-view="tracker">Exercices</button>
                <button class="nav-btn" data-view="dashboard">Dashboard</button>
            </nav>
        </header>

        <main>
            <!-- Tracker View -->
            <section id="tracker" class="view active">
                <div class="date-selector">
                    <button id="prev-day">&lt;</button>
                    <span id="current-date"></span>
                    <button id="next-day">&gt;</button>
                </div>

                <!-- Pompes -->
                <div class="exercise-card">
                    <div class="exercise-header">
                        <h2>Pompes</h2>
                        <span class="total" id="pompes-total">0</span>
                    </div>
                    <div class="series-list" id="pompes-series"></div>
                    <div class="btn-group">
                        <button class="add-btn" data-exercise="pompes" data-value="12">+12</button>
                        <button class="add-btn" data-exercise="pompes" data-value="15">+15</button>
                    </div>
                </div>

                <!-- Altères -->
                <div class="exercise-card">
                    <div class="exercise-header">
                        <h2>Altères</h2>
                        <span class="total" id="alteres-total">0</span>
                    </div>
                    <div class="series-list" id="alteres-series"></div>
                    <div class="btn-group">
                        <button class="add-btn" data-exercise="alteres" data-value="25">+25</button>
                    </div>
                </div>

                <!-- Gainage -->
                <div class="exercise-card">
                    <div class="exercise-header">
                        <h2>Gainage</h2>
                        <span class="total" id="gainage-total">0:00</span>
                    </div>
                    <div class="series-list" id="gainage-series"></div>
                    <div class="gainage-type">
                        <button class="type-btn active" data-type="normal">Normal</button>
                        <button class="type-btn" data-type="gauche">Gauche</button>
                        <button class="type-btn" data-type="droit">Droit</button>
                    </div>
                    <div class="btn-group">
                        <button class="add-btn gainage-btn" data-exercise="gainage" data-value="30">+30s</button>
                        <button class="add-btn gainage-btn" data-exercise="gainage" data-value="60">+1mn</button>
                        <button class="add-btn gainage-btn" data-exercise="gainage" data-value="90">+1mn30</button>
                    </div>
                </div>
            </section>

            <!-- Dashboard View -->
            <section id="dashboard" class="view">
                <div class="stats-period">
                    <button class="period-btn active" data-period="week">7 jours</button>
                    <button class="period-btn" data-period="month">30 jours</button>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>Pompes</h3>
                        <div class="stat-value" id="stats-pompes">0</div>
                        <div class="stat-label">total</div>
                    </div>
                    <div class="stat-card">
                        <h3>Altères</h3>
                        <div class="stat-value" id="stats-alteres">0</div>
                        <div class="stat-label">total</div>
                    </div>
                    <div class="stat-card">
                        <h3>Gainage</h3>
                        <div class="stat-value" id="stats-gainage">0:00</div>
                        <div class="stat-label">total</div>
                    </div>
                </div>

                <div class="chart-container">
                    <h3>Évolution (Pompes)</h3>
                    <canvas id="chart-pompes"></canvas>
                </div>

                <div class="chart-container">
                    <h3>Évolution (Altères)</h3>
                    <canvas id="chart-alteres"></canvas>
                </div>

                <div class="chart-container">
                    <h3>Évolution (Gainage)</h3>
                    <canvas id="chart-gainage"></canvas>
                </div>

                <div class="history">
                    <h3>Historique</h3>
                    <div id="history-list"></div>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
